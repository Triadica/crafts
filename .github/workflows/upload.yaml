name: Upload

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.repository }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'production' }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-node@v6.5.0
      with:
        node-version: 24
        package-manager-cache: false

    - name: Enable Corepack
      run: |
        corepack enable
        corepack prepare yarn@4.18.0 --activate

    - uses: calcit-lang/setup-calcit@v1.5.0
      with:
        tools: calcit,caps
        deps-file: deps.cirru
        caps-version: "0.1.1"

    - name: Install dependencies
      run: caps --strict --ci && yarn install --immutable && caps verify --toolchain

    - name: Validate source and types
      run: |
        set -euo pipefail
        test ! -e compact.cirru
        test ! -e package.cirru
        source_blob="$(git hash-object calcit.cirru)"
        calcit edit format
        test "$(git hash-object calcit.cirru)" = "$source_blob"
        calcit --check-only --all-defs --strict-types
        calcit --check-only --ns 'app.$meta' --ns app.comp.container \
          --ns app.comp.dandelions --ns app.comp.dense-tree --ns app.comp.jakc-tree \
          --ns app.comp.snowflakes --ns app.comp.whirlpool --ns app.config \
          --ns app.main --ns app.schema
        calcit fix --workflow strict --verify
        calcit test app.comp.container/connect-pieces --require-match
        calcit test app.comp.container/connect-pieces-dense --require-match
        calcit test app.comp.container/wind-pieces --require-match

    - name: Select frontend CDN path
      id: asset-path
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        asset_prefix="${GITHUB_REPOSITORY}/"
        if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
          asset_prefix="${GITHUB_REPOSITORY}/pr/${PR_NUMBER}/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/"
        fi
        echo "prefix=${asset_prefix}" >> "$GITHUB_OUTPUT"
        echo "base-url=https://cos-sh.tiye.me/${asset_prefix}" >> "$GITHUB_OUTPUT"

    - name: Compile and build frontend
      env:
        CDN_BASE_URL: ${{ steps.asset-path.outputs.base-url }}
      run: >
        calcit js
        && cp assets/* js-out/
        && yarn vite build --base="$CDN_BASE_URL"

    - name: Check current production revision
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      id: production
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
        if [[ "$GITHUB_SHA" == "$current_sha" ]]; then
          echo "current=true" >> "$GITHUB_OUTPUT"
        else
          echo "::notice::Skip stale production revision ${GITHUB_SHA}."
        fi

    - name: Upload and verify frontend assets
      if: steps.production.outputs.current == 'true'
      timeout-minutes: 10
      uses: worktools/cos-upload-action@v1.2.0
      with:
        source-dir: dist
        bucket: ${{ secrets.COS_BUCKET }}
        region: ap-shanghai
        prefix: ${{ steps.asset-path.outputs.prefix }}
        public-base-url: ${{ steps.asset-path.outputs.base-url }}
        secret-id: ${{ secrets.COS_SECRET_ID }}
        secret-key: ${{ secrets.COS_SECRET_KEY }}

    - name: Check page deployment revision
      if: steps.production.outputs.current == 'true'
      id: page
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
        if [[ "$GITHUB_SHA" == "$current_sha" ]]; then
          echo "current=true" >> "$GITHUB_OUTPUT"
        else
          echo "::notice::Skip stale page deployment ${GITHUB_SHA}."
        fi

    - name: Deploy to server
      if: steps.page.outputs.current == 'true'
      id: deploy
      uses: Pendect/action-rsyncer@v2.0.0
      env:
        DEPLOY_KEY: ${{secrets.rsync_private_key}}
      with:
        flags: '-avzr --progress'
        options: ''
        ssh_options: ''
        src: 'dist/*'
        dest: 'rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}'

    - name: Display status from deploy
      if: steps.page.outputs.current == 'true'
      run: echo "${{ steps.deploy.outputs.status }}"
