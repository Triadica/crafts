name: Protected Crafts final workflow validation
on:
  push:
    branches: [prepare/crafts-final-ci-0301]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Guard exact accepted candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = f4636e68e9cdd618d5fd2105c9cdb47eeead1d35
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = .github/workflows/prepare-final.yaml
          test "$(git hash-object calcit.cirru)" = 0ea367b6eb29abf1623ce54d5cc365afeafb3473
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.18.0 --activate
      - uses: calcit-lang/setup-calcit@v1.5.0
        with:
          tools: calcit,caps
          deps-file: deps.cirru
          caps-version: "0.1.1"
      - name: Install dependencies
        run: caps --strict --ci && yarn install --immutable && caps verify --toolchain
      - name: Validate source and types
        run: |
          set -euo pipefail
          test ! -e compact.cirru
          test ! -e package.cirru
          source_blob="$(git hash-object calcit.cirru)"
          calcit edit format
          test "$(git hash-object calcit.cirru)" = "$source_blob"
          calcit --check-only --all-defs --strict-types
          calcit --check-only --ns 'app.$meta' --ns app.comp.container \
            --ns app.comp.dandelions --ns app.comp.dense-tree --ns app.comp.jakc-tree \
            --ns app.comp.snowflakes --ns app.comp.whirlpool --ns app.config \
            --ns app.main --ns app.schema
          calcit fix --workflow strict --verify
          calcit test app.comp.container/connect-pieces --require-match
          calcit test app.comp.container/connect-pieces-dense --require-match
          calcit test app.comp.container/wind-pieces --require-match
      - name: Select frontend CDN path
        id: asset-path
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          asset_prefix="${GITHUB_REPOSITORY}/"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            asset_prefix="${GITHUB_REPOSITORY}/pr/${PR_NUMBER}/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/"
          fi
          echo "prefix=${asset_prefix}" >> "$GITHUB_OUTPUT"
          echo "base-url=https://cos-sh.tiye.me/${asset_prefix}" >> "$GITHUB_OUTPUT"
      - name: Compile and build frontend
        env:
          CDN_BASE_URL: ${{ steps.asset-path.outputs.base-url }}
        run: >
          calcit js
          && cp assets/* js-out/
          && yarn vite build --base="$CDN_BASE_URL"
      - name: Verify tracked files unchanged
        run: |
          set -euo pipefail
          git diff --quiet
          test "$(git hash-object calcit.cirru)" = 0ea367b6eb29abf1623ce54d5cc365afeafb3473
